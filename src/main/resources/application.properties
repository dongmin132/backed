spring.application.name=backed

# A git-ignored .env at the repo root (KEY=value lines) is read when present.
spring.config.import=optional:file:.env[.properties]

# Database: embedded PostgreSQL unless BACKED_DB_URL is set (see DataSourceConfig).
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=true

management.endpoints.web.exposure.include=health

# PayPal: "sandbox" uses the SDK adapter; tests set "fake".
backed.paypal.mode=sandbox
backed.paypal.client-id=${PAYPAL_CLIENT_ID:}
backed.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}

backed.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Sandbox test card used for top-ups (customers.card_ref = visa). The default number is the
# generic Visa test number, not a real card. If the sandbox declines it, generate a Visa card with
# the PayPal sandbox card generator (developer.paypal.com, Sandbox tools, Card testing) and set the
# BACKED_TEST_CARD_* variables. Expiry is YYYY-MM and must be in the future.
backed.test-cards.visa.number=${BACKED_TEST_CARD_NUMBER:4111111111111111}
backed.test-cards.visa.expiry=${BACKED_TEST_CARD_EXPIRY:2030-12}
backed.test-cards.visa.security-code=${BACKED_TEST_CARD_CVV:123}
backed.test-cards.visa.name=${BACKED_TEST_CARD_NAME:Sandbox Visa}
