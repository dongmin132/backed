spring.application.name=backed

# A git-ignored .env at the repo root (KEY=value lines) is read when present.
spring.config.import=optional:file:.env[.properties]

# Database: embedded PostgreSQL unless BACKED_DB_URL is set (see DataSourceConfig).
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=true

management.endpoints.web.exposure.include=health

# PayPal: "sandbox" uses the SDK adapter; tests set "fake".
backed.paypal.mode=sandbox
backed.paypal.client-id=${PAYPAL_CLIENT_ID:}
backed.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}

backed.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Sandbox test cards, referenced by customers.card_ref. Verify against PayPal's sandbox card list.
backed.test-cards.visa.number=4111111111111111
backed.test-cards.visa.expiry=2030-12
backed.test-cards.visa.security-code=123
backed.test-cards.visa.name=Sandbox Visa
